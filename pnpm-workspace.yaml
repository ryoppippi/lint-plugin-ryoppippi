packages:
  - packages/*

catalog:
  "@types/node": ^26.6.6
  "@typescript-eslint/parser": ^8.72.2
  "@typescript-eslint/typescript-estree": ^8.72.1
  eslint: ^10.14.0
  eslint-vitest-rule-tester: ^3.2.0
  fs-fixture: ^2.16.2
  oxlint: 1.92.0
  publint: ^0.3.25
  typescript: ^6.0.3
  unplugin-unused: ^0.6.0
  vite-plus: 1.5.0
  vitest: 5.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0

onlyBuiltDependencies:
  - esbuild
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
