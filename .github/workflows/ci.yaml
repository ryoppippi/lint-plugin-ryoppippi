# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
        with:
          cache: auto
          github-token: ${{ github.token }}
      - run: nix develop --command vp install --frozen-lockfile
      - run: nix develop --command vp run check
      - run: nix develop --command vp run test
      - run: nix fmt -- --fail-on-change
      - run: nix flake check

  pkg-pr-new:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
        with:
          cache: auto
          github-token: ${{ github.token }}
      - run: nix develop --command vp install --frozen-lockfile
      - run: nix develop --command vp exec pkg-pr-new publish './packages/*' --pnpm
